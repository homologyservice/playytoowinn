<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+Myanmar:wght@500;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="config.js"></script>
<link rel="stylesheet" href="ui.css">
<title>Profile</title>
<style>
#card{left:24px;top:128px;width:672px;height:320px}
#av{left:36px;top:60px;width:190px;height:190px}
#av img{position:absolute;left:0;top:0;width:190px;height:190px}
#av .ph{left:16px;top:16px;width:158px;height:158px;border-radius:50%;object-fit:cover}
#pname{left:252px;top:50px;width:400px;font-size:42px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pid{left:252px;top:110px;font-size:24px;color:#dbe8ff;display:flex;align-items:center;gap:12px}
#pid .pill{height:38px;font-size:18px;cursor:pointer}
#pcoins{left:252px;top:158px;display:flex;align-items:center;gap:6px;font-size:54px;font-weight:700;color:#ffd63a}
#pcoins img{width:72px}
#psince{left:252px;top:244px;font-size:22px;color:#cfe0ff}
.tile{width:324px;height:150px}
.tile img{position:absolute;left:14px;top:30px;width:90px}
.tile .v{position:absolute;left:116px;top:26px;font-size:46px;font-weight:700;color:#ffd63a}
.tile .l{position:absolute;left:116px;top:86px;width:200px;font-size:21px;line-height:1.15;color:#d7e6ff}
.menu{left:24px;width:672px;height:88px;border-radius:36px;display:flex;align-items:center;padding:0 24px}
.menu img{width:64px;margin-right:18px}
.menu .lb{flex:1;text-align:left;font-size:30px;font-weight:700}
.menu .ch{font-size:50px;color:#ffd63a;line-height:1}
.tg{position:relative;width:112px;height:56px;border-radius:28px;background:linear-gradient(#b9c0d6,#7f88a8);border:3px solid rgba(255,255,255,.7);transition:.2s}
.tg::after{content:"";position:absolute;left:4px;top:4px;width:40px;height:40px;border-radius:50%;background:#fff;box-shadow:0 3px 6px rgba(0,0,0,.4);transition:.2s}
.tg.on{background:linear-gradient(#72f2a6,#1fb878)}
.tg.on::after{left:60px}
</style>
</head>
<body>
<div id="stage">
 <button id="back" class="press"><img src="assets/34_back_button.webp" alt="back"></button>
 <div class="title hdr">PROFILE</div>
 <div class="chip-coins"><img src="assets/04_gold_coins.webp" alt=""><span id="coins">0</span></div>

 <div id="card" class="panel">
  <div id="av" class="a"><img class="ph" id="ph" src="assets/03_default_avatar.webp" alt=""><img src="assets/02_avatar_frame.webp" alt=""></div>
  <div id="pname" class="a t">Player</div>
  <div id="pid" class="a t"><span>ID <span id="pidv">-</span></span><span class="pill grey press" id="copyId">COPY</span></div>
  <div id="pcoins" class="a t"><img src="assets/04_gold_coins.webp" alt=""><span id="pc">0</span></div>
  <div id="psince" class="a"></div>
 </div>

 <div class="a panel dark tile" style="left:24px;top:470px"><img src="assets/icon_stat_rank.webp?v=2" alt=""><div class="v t" id="sRank">-</div><div class="l">Ranking</div></div>
 <div class="a panel dark tile" style="left:372px;top:470px"><img src="assets/icon_stat_games.webp?v=2" alt=""><div class="v t" id="sPlays">-</div><div class="l">Games played</div></div>
 <div class="a panel dark tile" style="left:24px;top:636px"><img src="assets/icon_stat_friends.webp?v=2" alt=""><div class="v t" id="sInv">-</div><div class="l">Friends invited</div></div>
 <div class="a panel dark tile" style="left:372px;top:636px"><img src="assets/icon_stat_wins.webp?v=2" alt=""><div class="v t" id="sDone">-</div><div class="l">Invites completed</div></div>

 <button class="a panel menu press" id="mInv" style="top:818px"><img src="assets/icon_menu_invites.webp?v=2" alt=""><span class="lb t">Invite friends</span><span class="ch">›</span></button>
 <button class="a panel menu press" id="mHis" style="top:918px"><img src="assets/icon_menu_transactions.webp?v=2" alt=""><span class="lb t">Tournament history</span><span class="ch">›</span></button>
 <button class="a panel menu press" id="mRank" style="top:1018px"><img src="assets/icon_stat_best.webp?v=2" alt=""><span class="lb t">Ranking</span><span class="ch">›</span></button>
 <div class="a panel menu" id="mVib" style="top:1118px"><img src="assets/icon_menu_vibrate.webp?v=2" alt=""><span class="lb t">Vibration</span><div class="tg" id="tgVib"></div></div>
</div>
<script src="common.js"></script>
<script>
fitStage($('stage'));
const home = () => { location.href = 'index.html' + location.search; };
$('back').onclick = home;
if (tg && tg.BackButton) { tg.BackButton.show(); tg.BackButton.onClick(home); }
const go = p => () => { haptic('light'); location.href = p + location.search; };
$('mInv').onclick = go('invites.html'); $('mHis').onclick = go('history.html'); $('mRank').onclick = go('ranking.html');
const vibOn = () => localStorage.getItem('p2w_vib') !== '0';
const paintVib = () => $('tgVib').classList.toggle('on', vibOn());
$('mVib').onclick = () => { localStorage.setItem('p2w_vib', vibOn() ? '0' : '1'); paintVib(); haptic('medium'); };
paintVib();
const u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
if (u && u.photo_url) { $('ph').src = u.photo_url; $('ph').onerror = () => { $('ph').src = 'assets/03_default_avatar.webp'; }; }
$('copyId').onclick = async () => { try { await navigator.clipboard.writeText($('pidv').textContent); toast('ID copied'); } catch (e) { toast('Could not copy'); } };
(async () => {
  try {
    const p = await api.profile();
    $('pname').textContent = p.name; $('pidv').textContent = p.id; $('pc').textContent = fmt(p.coins); $('coins').textContent = fmt(p.coins);
    $('sRank').textContent = '#' + p.rank; $('sPlays').textContent = p.plays; $('sInv').textContent = p.invited; $('sDone').textContent = p.completed;
    const days = Math.max(1, Math.round((Date.now() - p.since) / 86400000)); $('psince').textContent = 'Playing for ' + days + (days > 1 ? ' days' : ' day');
  } catch (e) { toast('Could not load the profile'); }
})();
</script>
</body>
</html>
