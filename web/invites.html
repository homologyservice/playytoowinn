<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+Myanmar:wght@500;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="config.js"></script>
<link rel="stylesheet" href="ui.css">
<title>Invites</title>
<style>
#top{left:24px;top:128px;width:672px;height:430px}
#hero{left:-14px;top:24px;width:318px}
#h1{left:296px;top:30px;width:360px;font-size:27px;line-height:1.2}
#h2{left:296px;top:66px;width:360px;font-size:62px;line-height:1.1;font-weight:700;display:flex;align-items:center;gap:6px}
#h2 img{width:70px}
#h3{left:296px;top:146px;width:360px;font-size:21px;color:#e3efff}
#link{left:22px;top:222px;width:352px;height:76px;border-radius:38px;padding:0 22px;display:flex;align-items:center;font-size:21px;color:#cfe0ff;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
 background:linear-gradient(#10164a,#1b2466);border:3px solid #5f6fe8;box-shadow:inset 0 4px 10px rgba(0,0,0,.5)}
#copyBtn{left:386px;top:218px;width:146px;height:84px;font-size:28px}
#shareBtn{left:542px;top:218px;width:112px;height:84px}
#shareBtn svg{width:46px;height:46px}
.steps{position:absolute;left:14px;right:14px;top:322px;height:92px;display:flex;justify-content:space-between;align-items:center}
.steps .s{width:30%;display:flex;align-items:center;gap:6px;font-size:17px;line-height:1.15;color:#e9f2ff}
.steps .s img{width:64px;flex:none}
.steps .ar{color:#ffd63a;font-size:26px;font-weight:700}
.tab{position:absolute;top:578px;height:76px;font-size:32px;font-weight:700;color:#fff}
.tab.off{color:#9aa4ff}
#list{position:absolute;left:76px;top:716px;width:572px;height:470px;overflow-y:auto;overflow-x:hidden}
#listIn{width:660px;zoom:.866}
#list::-webkit-scrollbar{display:none}
.row{position:relative;width:660px;height:108px;margin-bottom:12px;flex:none}
.row .bg{position:absolute;inset:0;background-size:100% 100%}
.row .av{position:absolute;left:14px;top:20px;width:68px}
.row .nm{position:absolute;left:98px;top:18px;width:250px;font-size:26px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .dt{position:absolute;left:98px;top:58px;width:250px;font-size:19px;color:#a9b3ff}
.row .st{position:absolute;right:14px;top:24px}
.row .bt{position:absolute;right:10px;top:18px;width:236px;height:74px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:24px;font-weight:700;background-size:100% 100%;background-repeat:no-repeat}
.row .bt img{width:40px}
#hint{left:40px;width:640px;top:668px;font-size:19px;color:#cfd8ff;text-align:center}
#empty{display:none;left:100px;width:520px;top:740px}
</style>
</head>
<body>
<div id="stage">
 <button id="back" class="press"><img src="assets/34_back_button.webp" alt="back"></button>
 <div class="title hdr">INVITES</div>
 <div class="chip-coins"><img src="assets/04_gold_coins.webp" alt=""><span id="coins">0</span></div>

 <div id="top" class="panel">
  <img id="hero" class="a" src="assets/invites_hero.webp" alt="">
  <div id="h1" class="a t">Invite a friend and get</div>
  <div id="h2" class="a gold t"><img src="assets/04_gold_coins.webp" alt=""><span id="rw">2000</span></div>
  <div id="h3" class="a mm">သူငယ်ချင်းတစ်ယောက်ဖိတ်ပြီး <b class="gold" id="rw2">2000</b> coins ရယူပါ</div>
  <div id="link" class="a">Loading…</div>
  <button id="copyBtn" class="btn gold press">COPY</button>
  <button id="shareBtn" class="btn blue press" aria-label="Share"><svg viewBox="0 0 24 24" fill="#fff"><path d="M21.5 3.2 2.9 10.4c-.9.4-.9 1.6 0 1.9l4.6 1.5 1.8 5.6c.2.7 1.1.9 1.6.4l2.6-2.5 4.7 3.5c.6.4 1.4.1 1.6-.6L22.8 4.4c.2-.9-.6-1.5-1.3-1.2zM9.5 13.2l8.6-5.4-6.7 6.6-.3 3.3-1.6-4.5z"/></svg></button>
  <div class="steps t">
   <div class="s"><img src="assets/step_icon_1_share.webp" alt=""><span>Share your link</span></div><span class="ar">›</span>
   <div class="s"><img src="assets/step_icon_2_join.webp" alt=""><span>Friend plays a game</span></div><span class="ar">›</span>
   <div class="s"><img src="assets/step_icon_3_reward.webp" alt=""><span>Claim <b class="gold" id="rw3">2000</b></span></div>
  </div>
 </div>

 <button class="tab stretch press t" data-f="pending" id="tabP" style="left:30px;width:326px;background-image:url(assets/68_tab_active.webp)">PENDING</button>
 <button class="tab stretch press t off" data-f="done" id="tabC" style="left:364px;width:326px;background-image:url(assets/69_tab_inactive.webp)">COMPLETED</button>
 <div id="hint" class="a t"></div>
 <div class="a stretch" style="left:14px;top:690px;width:692px;height:520px;background-image:url(assets/70_list_container.webp)"></div>
 <div id="list"><div id="listIn"></div></div>
 <div id="empty" class="a c">
  <img id="emptyImg" style="width:250px;margin:0 auto 6px" src="assets/empty_pending.webp" alt="">
  <div id="emptyT" class="t" style="font-size:32px;font-weight:700"></div>
  <div id="emptyS" style="font-size:22px;opacity:.9;margin-top:6px"></div>
 </div>

 <div id="pop" class="scrim">
  <div id="popPanel" class="panel pop">
   <img id="popBurst" class="a rot" src="assets/claim_success_burst.webp" alt="">
   <div id="popTitle" class="title t">REWARD!</div>
   <img id="popIcon" class="a" src="assets/prize_coins_500.webp" alt="">
   <div id="popAmt" class="a c gold t"></div>
   <div id="popSub" class="a c"></div>
   <button id="popBtn" class="btn gold">OK</button>
  </div>
 </div>
 <div id="fxTop" class="a"></div>
</div>
<script src="common.js"></script>
<script src="fx.js"></script>
<script>
fitStage($('stage'));
const home = () => { location.href = 'index.html' + location.search; };
$('back').onclick = home;
if (tg && tg.BackButton) { tg.BackButton.show(); tg.BackButton.onClick(home); }

const AV = ['79_avatar_blue','79_avatar_green','79_avatar_pink','79_avatar_purple','79_avatar_red','79_avatar_yellow'];
const hash = s => { let h = 2166136261; for (const c of String(s)) { h ^= c.codePointAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
const ago = ts => { const m = Math.max(1, Math.round((Date.now() - ts) / 60000)); return m < 60 ? m + ' min ago' : m < 1440 ? Math.round(m / 60) + ' h ago' : Math.round(m / 1440) + ' d ago'; };
let D = null, tab = 'pending', claiming = false;

function setTab(t) {
  tab = t;
  [['pending', 'tabP'], ['done', 'tabC']].forEach(([k, id]) => { const on = k === t, b = $(id); b.classList.toggle('off', !on); b.style.backgroundImage = `url(assets/${on ? '68_tab_active' : '69_tab_inactive'}.webp)`; });
  render();
}
document.querySelectorAll('.tab').forEach(b => b.onclick = () => { haptic('light'); setTab(b.dataset.f); });

function render() {
  if (!D) return;
  $('tabP').textContent = `PENDING (${D.pending.length})`; $('tabC').textContent = `COMPLETED (${D.completed.length})`;
  const toClaim = D.completed.filter(x => !x.claimed).length;
  if (toClaim) $('tabC').textContent += ' •';
  $('hint').innerHTML = tab === 'pending' ? 'Friends move to Completed after their first game'
    : toClaim ? `<span class="gold">${toClaim} reward${toClaim > 1 ? 's' : ''} ready to claim!</span>` : 'Claim ' + D.reward + ' coins for every friend who played.';
  const list = $('listIn'); list.innerHTML = '';
  const items = tab === 'pending' ? D.pending : D.completed;
  $('empty').style.display = items.length ? 'none' : 'block';
  if (!items.length) {
    $('emptyImg').src = `assets/${tab === 'pending' ? 'empty_pending' : 'empty_completed'}.webp`;
    $('emptyT').textContent = tab === 'pending' ? 'No friends waiting' : 'No completed invites yet';
    $('emptyS').textContent = tab === 'pending' ? 'Share your link to invite a friend' : 'When a friend plays their first game it shows up here';
  }
  items.forEach(i => {
    const r = document.createElement('div'); r.className = 'row'; r.dataset.id = i.id;
    const done = tab === 'done';
    let right;
    if (!done) right = '<div class="st"><span class="pill orange">PENDING</span></div>';
    else if (i.claimed) right = '<div class="bt t" style="background-image:url(assets/76_button_claimed.webp);color:#cfd6ff">CLAIMED</div>';
    else right = `<div class="bt t" data-claim="${escHtml(i.id)}" style="background-image:url(assets/75_button_claim.webp);cursor:pointer"><img src="assets/04_gold_coins.webp" alt="">CLAIM ${D.reward}</div>`;
    r.innerHTML = `<div class="bg" style="background-image:url(assets/${done ? '71_row_card_win' : '72_row_card_loss'}.webp)"></div>
      <img class="av" src="assets/${AV[hash(i.name) % AV.length]}.webp" alt=""><div class="nm t">${escHtml(i.name)}</div>
      <div class="dt">${done ? 'Played ' : 'Joined '}${ago(i.at)}</div>${right}`;
    list.appendChild(r);
  });
  list.querySelectorAll('[data-claim]').forEach(b => b.onclick = () => claim(b.dataset.claim));
}

async function claim(id) {
  if (claiming) return; claiming = true;
  try {
    const r = await api.invitesClaim(id);
    D.completed.forEach(x => { if (x.id === id) x.claimed = true; }); D.coins = r.coins; $('coins').textContent = fmt(r.coins); render(); showReward(r.amount);
  } catch (e) {
    if (e.message === 'nothing_to_claim') { D.completed.forEach(x => { if (x.id === id) x.claimed = true; }); render(); toast('Already claimed'); } else toast('Could not claim, try again');
  }
  claiming = false;
}
function showReward(n) {
  const fx = $('fxTop'); fx.innerHTML = '';
  $('popTitle').textContent = 'REWARD!'; $('popAmt').innerHTML = `+${n} <span style="font-size:36px">coins</span>`; $('popSub').innerHTML = 'Thanks for inviting a friend!<br><span class="mm" style="font-size:22px">သူငယ်ချင်းဖိတ်ပေးတဲ့အတွက် ကျေးဇူးတင်ပါတယ်</span>'; $('popBtn').textContent = 'OK';
  FX.sparkles(fx, 360, 560, 12, 280); FX.coins(fx, 360, 620, 14); FX.confetti(fx, 30, 720); haptic('success');
  $('pop').classList.add('on'); const pp = $('popPanel'); pp.classList.remove('pop'); void pp.offsetWidth; pp.classList.add('pop');
  $('popBtn').onclick = () => { $('pop').classList.remove('on'); fx.innerHTML = ''; };
}

/* link: copy + share */
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; } catch (e) {}
  try { const ta = document.createElement('textarea'); ta.value = t; ta.style.cssText = 'position:fixed;left:-999px;top:0'; document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok; } catch (e) { return false; }
}
$('copyBtn').onclick = async () => { if (!D || !D.link) return toast('Link is not ready yet'); toast((await copyText(D.link)) ? 'Link copied!' : 'Could not copy'); haptic('light'); };
$('shareBtn').onclick = () => {
  if (!D || !D.link) return toast('Link is not ready yet');
  const msg = `Join me on Play2Win and win coins! Use my link:`;
  const url = `https://t.me/share/url?url=${encodeURIComponent(D.link)}&text=${encodeURIComponent(msg)}`;
  if (tg && tg.openTelegramLink) tg.openTelegramLink(url); else if (navigator.share) navigator.share({ text: msg, url: D.link }).catch(() => {}); else window.open(url, '_blank');
};

(async () => {
  try {
    D = await api.invitesState();
    $('coins').textContent = fmt(D.coins); ['rw', 'rw2', 'rw3'].forEach(i => $(i).textContent = D.reward);
    $('link').textContent = D.link ? D.link.replace('https://', '') : 'Link not ready yet';
    $('copyBtn').classList.toggle('off', !D.link); $('shareBtn').classList.toggle('off', !D.link);
    setTab(D.completed.some(x => !x.claimed) ? 'done' : 'pending');
  } catch (e) { toast('Could not load invites'); }
})();
</script>
</body>
</html>
