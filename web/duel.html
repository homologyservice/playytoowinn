<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#4a46b8 url(assets/35_lobby_background.webp) center/cover no-repeat;
 font-family:"Fredoka","Nunito","Segoe UI",system-ui,sans-serif;font-weight:600;color:#fff;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#stage{position:absolute;left:0;top:0;width:720px;height:1280px;transform-origin:0 0}
#cv{position:absolute;left:0;top:0;display:none;touch-action:none}
.a{position:absolute}.c{text-align:center}
img{display:block;-webkit-user-drag:none}
button>img{width:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.t{text-shadow:0 3px 0 rgba(30,20,110,.8),0 0 8px rgba(30,20,110,.5)}
.gold{color:#ffd63a}
.press:active{transform:scale(.96)}
.layer{position:absolute;inset:0;display:none}
.layer.on{display:block}
.stretch{background-size:100% 100%;background-repeat:no-repeat}
.dim{filter:grayscale(.85) brightness(.8)}
#toast{position:fixed;left:50%;bottom:14%;transform:translate(-50%,20px);background:rgba(20,10,80,.92);padding:10px 18px;border-radius:16px;opacity:0;transition:.25s;pointer-events:none;font-size:15px;z-index:99;max-width:86vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-14px) rotate(3deg)}}
.bob{animation:bob 2.2s ease-in-out infinite}
@keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
.pop{animation:pop .45s ease-out both}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{animation:spin 1.1s linear infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.pulse{animation:pulse 1.2s ease-in-out infinite}
</style>

<script src="common.js"></script>
<script>
/* ------------------------------------------------------------------ */
/*  Assets                                                             */
/* ------------------------------------------------------------------ */
const IMG = {};
['28_fly_dodge_sky_background','56_clouds','55_ground_strip','15_pipe_up','14_fly_dodge_rocket','57_rocket_crash','58_explosion_burst'].forEach(n=>{
  const i=new Image(); i.src='assets/'+n+'.webp'; IMG[n]=i;
});
const AV=['79_avatar_blue','79_avatar_green','79_avatar_pink','79_avatar_purple','79_avatar_red','79_avatar_yellow'];
const stage=$('stage'); fitStage(stage);
const hash=s=>{let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0};
const avatarIdx=name=>hash(name)%AV.length;

/* ------------------------------------------------------------------ */
/*  State                                                              */
/* ------------------------------------------------------------------ */
let state='lobby', coins=0, session=null, busy=false, lastScore=0;
const show=(id,on)=>$(id).classList.toggle('on',on);

async function refreshCoins(){ try{ const u=await api.me(); coins=u.coins; $('lcoins').textContent=fmt(coins); $('play').classList.toggle('dim',coins<FEE);}catch(e){} }
async function checkClaimDot(){ try{ const h=await api.history(); const now=Date.now(); $('hdot').style.display=h.items.some(i=>i.prize&&!i.claimed&&i.claimAt&&now>=i.claimAt)?'block':'none'; }catch(e){} }
refreshCoins(); checkClaimDot();

/* opponent slot-style spinner */
const strip=$('strip');
for(let r=0;r<10;r++) AV.forEach(a=>{const im=document.createElement('img');im.src='assets/'+a+'.webp';im.style.cssText='width:118px;height:118px;object-fit:cover;display:block';strip.appendChild(im);});
const qImg=document.createElement('img'); qImg.src='assets/39_opponent_avatar_dim.webp'; qImg.style.cssText='position:absolute;left:0;top:0;width:118px;height:118px;object-fit:cover;display:block';
strip.parentNode.appendChild(qImg);
strip.style.transform='translateY(-'+(30*118)+'px)'; strip.style.display='none';

function spinTo(finalIdx,ms){
  return new Promise(res=>{
    qImg.style.display='none'; strip.style.display='block';
    const up=Math.random()<.5, from=30, to=up?48+finalIdx:12+finalIdx, t0=performance.now();
    const ease=x=>1-Math.pow(1-x,3);
    (function f(now){
      const k=Math.min(1,(now-t0)/ms), idx=from+(to-from)*ease(k);
      strip.style.transform=`translateY(${-idx*118}px)`;
      if(k<1) requestAnimationFrame(f); else res();
    })(t0);
  });
}
function flicker(ms,cb){ const iv=setInterval(cb,70); return new Promise(r=>setTimeout(()=>{clearInterval(iv);r();},ms)); }

/* ------------------------------------------------------------------ */
/*  Lobby actions                                                      */
/* ------------------------------------------------------------------ */
$('back').onclick=()=>{ location.href='index.html'; };
$('hist').onclick=()=>{ location.href='history.html'+location.search; };
if(tg&&tg.BackButton){ tg.BackButton.show(); tg.BackButton.onClick(()=>{ if(state==='lobby') location.href='index.html'; else if(state==='run') openExit(); }); }

$('play').onclick=async()=>{
  if(busy) return;
  if(coins<FEE){ toast('You need '+FEE+' coins to play'); haptic('rigid'); return; }
  busy=true; state='spin'; haptic('medium');
  $('oppNote').textContent='Searching opponent…';
  const startP=api.start().catch(e=>e);
  let spinning=true;
  const iv0=setInterval(()=>{ if(!spinning) return; $('oppName').textContent='Player '+(1000+Math.floor(Math.random()*9000)); $('oppScore').textContent=Math.floor(Math.random()*80); },70);
  let s=await startP; spinning=false; clearInterval(iv0);
  if(s instanceof Error){ busy=false; state='lobby'; $('oppName').textContent='OPPONENT'; $('oppScore').textContent='0'; $('oppNote').textContent='From a previous run';
    toast(s.message==='not_enough_coins'?'You need '+FEE+' coins to play':'Connection problem, try again'); refreshCoins(); return; }
  session=s; coins=s.coins; $('lcoins').textContent=fmt(coins);
  const idx=s.opponent?avatarIdx(s.opponent.name):0;
  await Promise.all([ spinTo(idx,1700), flicker(1700,()=>{ $('oppName').textContent='Player '+(1000+Math.floor(Math.random()*9000)); $('oppScore').textContent=Math.floor(Math.random()*80); }) ]);
  if(s.opponent){
    $('oppName').textContent=s.opponent.name; $('oppScore').textContent=s.opponent.score; $('oppNote').textContent='From a previous run';
  } else {
    strip.style.display='none'; qImg.src='assets/40_waiting_avatar_question.webp'; qImg.style.display='block';
    $('oppName').textContent='WAITING…'; $('oppScore').textContent='?'; $('oppNote').textContent='Waiting for other players';
  }
  haptic('heavy');
  await new Promise(r=>setTimeout(r,900));
  startIntro();
};

/* ------------------------------------------------------------------ */
/*  Intro 5s                                                           */
/* ------------------------------------------------------------------ */
function startIntro(){
  state='intro'; initWorld(session.seed); spawnPipes(); cv.style.display='block'; draw(performance.now());
  show('lobby',false); show('intro',true); show('hud',true); $('exitBtn').style.display='block';
  const o=session.opponent;
  $('hMe').textContent='Your Score: 0'; $('hOpp').textContent=o?`${o.name}: ${o.score}`:'Waiting…';
  if(o){ $('inTitle').textContent='SCORE TO BEAT'; $('inBig').textContent=o.score; $('inBig').style.fontSize='104px'; $('inName').textContent=o.name;
         $('inPrize').innerHTML='WIN <span class="gold">+'+PRIZE+' COINS</span>'; }
  else { $('inTitle').textContent='WAITING TO OTHER PLAYERS'; $('inBig').textContent='…'; $('inName').textContent='No opponent yet — set your best score!';
         $('inPrize').innerHTML='Your score becomes the target'; }
  let n=5; $('cd').textContent=n; $('cdTxt').textContent='START IN '+n+'s';
  const iv=setInterval(()=>{
    if(state!=='intro'){ clearInterval(iv); return; }
    if($('exitDlg').classList.contains('on')) return;
    n--; if(n<=0){ clearInterval(iv); show('intro',false); beginRun(); return; }
    $('cd').textContent=n; $('cdTxt').textContent='START IN '+n+'s'; haptic('light');
  },1000);
}

/* ------------------------------------------------------------------ */
/*  Flappy engine (fixed timestep, seeded pipes => both players get the same course) */
/* ------------------------------------------------------------------ */
const cv=$('cv'), cx=cv.getContext('2d');
const H=1280, GROUND=1160, PW=132, GRAV=2700, FLAP=-840, RR=34;
// Difficulty ramps with the pipe number n (same for both players => same course):
const gapFor=n=>Math.max(270,385-n*4);            // gap shrinks 385 -> 270
const spaceFor=n=>330+Math.min(n*2,70);           // pipes are close together (like Flappy Bird)
const swingFor=n=>Math.min(300,160+n*6);          // how far the next gap can jump up/down
const speedFor=sc=>290+Math.min(sc*5,160);        // scroll speed 290 -> 450
const PIPE={sx:125,sy:27,sw:263,sh:463,cap:110};
const ROCKET={sx:10,sy:48,sw:492,sh:402};
let W=720,S=1,DPR=1;
function resize(){ DPR=Math.min(devicePixelRatio||1,2); const w=innerWidth,h=innerHeight; cv.width=w*DPR; cv.height=h*DPR; cv.style.width=w+'px'; cv.style.height=h+'px'; S=h/H; W=w/S; }
resize(); addEventListener('resize',()=>{resize(); if(state!=='run') draw(performance.now());});

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let wd; // world
function initWorld(seed){
  const rx0=Math.max(170,W*.3);
  wd={rnd:mulberry(hash(seed)), rx:rx0, ry:560, vy:0, pipes:[], nextX:rx0+520, idx:0, prevGy:640, score:0, dist:0, t:0, passedOpp:false, dead:false, deadT:0, paused:false};
}
function spawnPipes(){
  while(wd.nextX<W+PW+80){
    const n=wd.idx++, gap=gapFor(n), lo=gap/2+90, hi=GROUND-gap/2-90;
    let gy=wd.prevGy+(wd.rnd()*2-1)*swingFor(n);
    gy=Math.max(lo,Math.min(hi,gy)); wd.prevGy=gy;
    wd.pipes.push({x:wd.nextX, gy, gap, passed:false});
    wd.nextX+=spaceFor(n);
  }
}
function pipeShape(x,y,len,flip){ // rim at (x,y); body extends +len (or -len when flip)
  const sc=PW/PIPE.sw, capH=PIPE.cap*sc, im=IMG['15_pipe_up'];
  cx.save(); cx.translate(x,y); if(flip) cx.scale(1,-1);
  cx.drawImage(im,PIPE.sx,PIPE.sy,PIPE.sw,PIPE.cap,0,0,PW,capH);
  if(len>capH) cx.drawImage(im,PIPE.sx,PIPE.sy+PIPE.cap+60,PIPE.sw,110,0,capH-1,PW,len-capH+1);
  cx.restore();
}
function circleRect(cx0,cy0,r,x,y,w,h){const nx=Math.max(x,Math.min(cx0,x+w)),ny=Math.max(y,Math.min(cy0,y+h));return (cx0-nx)**2+(cy0-ny)**2<r*r}

function step(dt){
  if(state==='intro'){ wd.t+=dt; wd.ry=560+Math.sin(wd.t*3)*14; wd.dist+=60*dt; return; }
  if(state==='dead'){ wd.deadT+=dt; wd.vy=Math.min(900,wd.vy+GRAV*dt); wd.ry=Math.min(GROUND-40,wd.ry+wd.vy*dt); return; }
  if(state!=='run'||wd.paused) return;
  const SPEED=speedFor(wd.score); wd.t+=dt; wd.dist+=SPEED*dt;
  wd.vy=Math.min(1100,wd.vy+GRAV*dt); wd.ry+=wd.vy*dt;
  if(wd.ry<RR){ wd.ry=RR; wd.vy=0; }
  wd.nextX-=SPEED*dt;           // the spawn point scrolls with the world
  spawnPipes();
  for(const p of wd.pipes){
    p.x-=SPEED*dt;
    if(!p.passed&&p.x+PW<wd.rx-RR){ p.passed=true; wd.score++; onScore(); }
    if(circleRect(wd.rx,wd.ry,RR-4,p.x,-50,PW,p.gy-p.gap/2+50)||circleRect(wd.rx,wd.ry,RR-4,p.x,p.gy+p.gap/2,PW,GROUND-(p.gy+p.gap/2))) return crash();
  }
  wd.pipes=wd.pipes.filter(p=>p.x>-PW-20);
  if(wd.ry+RR>GROUND) crash();
}
function onScore(){
  $('hMe').textContent='Your Score: '+wd.score; haptic('light');
  const o=session.opponent;
  if(o&&!wd.passedOpp&&wd.score>o.score){ wd.passedOpp=true; const f=$('flash'); f.style.opacity=1; haptic('success'); setTimeout(()=>f.style.opacity=0,1400); }
}
function crash(){
  if(state!=='run') return; state='dead'; wd.dead=true; wd.deadT=0; wd.vy=-420; haptic('error');
  setTimeout(()=>endRun(false),1100);
}

function draw(now){
  if(!wd) return;
  cx.setTransform(DPR*S,0,0,DPR*S,0,0);
  // sky
  const sky=IMG['28_fly_dodge_sky_background']; if(sky.complete) cx.drawImage(sky,0,0,Math.max(W,720),H);
  // clouds
  const cl=IMG['56_clouds'];
  if(cl.complete){ for(let i=0;i<3;i++){ const x=((i*520-wd.dist*.12)%(W+500)+W+500)%(W+500)-250; cx.globalAlpha=.9; cx.drawImage(cl,x,120+i*210,300,150);} cx.globalAlpha=1; }
  // pipes
  for(const p of wd.pipes){ pipeShape(p.x,p.gy-p.gap/2,p.gy-p.gap/2+60,true); pipeShape(p.x,p.gy+p.gap/2,GROUND-(p.gy+p.gap/2)+10,false); }
  // ground
  const g=IMG['55_ground_strip'];
  cx.fillStyle='#7a4a22'; cx.fillRect(0,GROUND+60,W,H);
  if(g.complete){ const tw=g.width*2.6, th=g.height*2.6, off=-(wd.dist%tw); for(let x=off;x<W;x+=tw) cx.drawImage(g,x,GROUND-8,tw,th+60); }
  // opponent marker (only after passing there's a flash; keep canvas clean)
  // rocket
  if(wd.dead){
    const k=Math.min(1,wd.deadT/.35), cr=IMG['57_rocket_crash'], ex=IMG['58_explosion_burst'];
    if(ex.complete&&wd.deadT<.6){ const sz=260*k; cx.globalAlpha=1-wd.deadT/.7; cx.drawImage(ex,wd.rx-sz/2,wd.ry-sz/2,sz,sz); cx.globalAlpha=1; }
    if(cr.complete) cx.drawImage(cr,wd.rx-80,wd.ry-82,160,167);
  } else {
    const r=IMG['14_fly_dodge_rocket']; if(r.complete){
      cx.save(); cx.translate(wd.rx,wd.ry); cx.rotate(Math.max(-.5,Math.min(.9,wd.vy/1100))*.7);
      cx.drawImage(r,ROCKET.sx,ROCKET.sy,ROCKET.sw,ROCKET.sh,-78,-64,156,128); cx.restore(); }
  }
  // big score
  if(state==='run'||state==='dead'){
    cx.font='700 130px Fredoka, sans-serif'; cx.textAlign='center'; cx.lineWidth=14; cx.strokeStyle='rgba(30,20,110,.85)'; cx.fillStyle='#fff';
    const x=W/2; cx.strokeText(wd.score,x,330); cx.fillText(wd.score,x,330);
  }
}

let last=0, acc=0;
function loop(now){
  if(cv.style.display!=='none'){
    const dt=Math.min(.05,(now-last)/1000); last=now; acc+=dt;
    while(acc>=1/120){ step(1/120); acc-=1/120; }
    draw(now);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(t=>{last=t;loop(t)});

function beginRun(){
  state='run'; wd.vy=FLAP; wd.t=0;
  haptic('medium');
}
const tap=e=>{ if(state==='run'&&!wd.paused){ wd.vy=FLAP; } e.preventDefault(); };
cv.addEventListener('pointerdown',tap);
addEventListener('keydown',e=>{ if(e.code==='Space') tap(e); });

/* ------------------------------------------------------------------ */
/*  Exit                                                               */
/* ------------------------------------------------------------------ */
function openExit(){ if(state!=='run'&&state!=='intro') return; if(wd) wd.paused=true; show('exitDlg',true); }
$('exitBtn').onclick=openExit;
$('exitNo').onclick=()=>{ show('exitDlg',false); if(wd) wd.paused=false; };
$('exitYes').onclick=async()=>{
  show('exitDlg',false); const s=session; state='lobby';
  try{ const r=await api.finish({matchId:s.matchId,score:0,forfeit:true}); coins=r.coins; }catch(e){}
  toast('You left the match and lost '+FEE+' coins'); backToLobby();
};

/* ------------------------------------------------------------------ */
/*  End of run + result                                                */
/* ------------------------------------------------------------------ */
async function endRun(forfeit){
  if(state!=='dead') return;
  const score=wd.score; state='result'; lastScore=score;
  show('hud',false); $('exitBtn').style.display='none';
  let r;
  try{ r=await api.finish({matchId:session.matchId,score}); }
  catch(e){ toast('Connection problem — retrying…'); await new Promise(x=>setTimeout(x,1500));
            try{ r=await api.finish({matchId:session.matchId,score}); }catch(e2){ toast('Could not save the result'); backToLobby(); return; } }
  coins=r.coins; showResult(r,score);
}
function showResult(r,score){
  const ban=$('rBanner'), burst=$('rBurst'), spin=$('rSpin'), line=$('rLine');
  show('result',true); spin.style.display='none'; burst.style.display='none';
  $('rMe').textContent=score;
  const o=session.opponent;
  $('rOppN').textContent=o?o.name:'Opponent'; $('rOpp').textContent=o?o.score:'?';
  ban.className='a pop';
  if(r.result==='waiting'){
    ban.style.display='none'; spin.style.display='block'; $('rOpp').textContent='?'; $('rOppN').textContent='Waiting…';
    line.innerHTML='<span class="gold">Score saved!</span><br>Waiting for other players.<br>Check History for the result.';
  } else {
    ban.style.display='block';
    ban.src='assets/'+(r.result==='win'?'61_you_win_banner':r.result==='loss'?'62_you_lose_banner':'63_draw_banner')+'.webp';
    if(r.result==='win'){ burst.style.display='block'; burst.className='a pop'; line.innerHTML='<span class="gold">+'+r.prize+' COINS</span><br><span style="font-size:26px;font-weight:600">Claim it in History after 10 minutes</span>'; haptic('success'); }
    else if(r.result==='draw'){ line.innerHTML='Entry fee returned<br><span class="gold">+'+r.prize+' COINS</span><br><span style="font-size:26px;font-weight:600">Claim it in History after 10 minutes</span>'; }
    else line.innerHTML='Better luck next time!<br><span style="font-size:26px;font-weight:600">Beat their score to win.</span>';
  }
}
function backToLobby(){
  state='lobby'; busy=false; session=null;
  cv.style.display='none'; ['intro','hud','result','exitDlg'].forEach(i=>show(i,false)); show('lobby',true); $('exitBtn').style.display='none';
  strip.style.display='none'; qImg.src='assets/39_opponent_avatar_dim.webp'; qImg.style.display='block'; strip.style.transform='translateY(-'+(30*118)+'px)';
  $('oppName').textContent='OPPONENT'; $('oppScore').textContent='0'; $('oppNote').textContent='From a previous run'; $('myScore').textContent=lastScore;
  refreshCoins(); checkClaimDot();
}
$('rLobby').onclick=backToLobby;
$('rHist').onclick=()=>{ location.href='history.html'+location.search; };
</script>
